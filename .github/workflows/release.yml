name: release

# Publica un release cuando empujas una etiqueta vX.Y.Z (p. ej. git tag v1.0.0).
# Compila el launcher para Windows/Linux/macOS, genera el manifest.json con los
# hashes y sube todo (binarios + manifiesto + payload) como assets del release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Variables
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Compilar binarios del launcher
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          MANIFEST_URL: ${{ steps.vars.outputs.manifest_url }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.manifestURL=${MANIFEST_URL}"
          build() {
            # En Windows, -H windowsgui oculta la ventana de consola (usamos GUI nativa).
            extra=""
            if [ "$1" = "windows" ]; then extra="-H windowsgui"; fi
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "$extra $LDFLAGS" -o "dist/$3" ./cmd/launcher
          }
          build windows amd64 pzlauncher-windows-amd64.exe
          build linux   amd64 pzlauncher-linux-amd64
          build darwin  amd64 pzlauncher-darwin-amd64
          build darwin  arm64 pzlauncher-darwin-arm64

      - name: Copiar payload del juego
        # Deja aquí los ficheros que quieras distribuir (p. ej. projectzomboid.jar).
        run: |
          if [ -d payload ]; then cp -v payload/* dist/; fi

      - name: Generar manifest.json
        run: |
          ARGS=()
          [ -f dist/projectzomboid.jar ] && ARGS+=(-game "projectzomboid.jar=dist/projectzomboid.jar")
          go run ./tools/genmanifest \
            -release-url "${{ steps.vars.outputs.release_url }}" \
            -version "${{ steps.vars.outputs.version }}" \
            "${ARGS[@]}" \
            -bin windows/amd64=dist/pzlauncher-windows-amd64.exe \
            -bin linux/amd64=dist/pzlauncher-linux-amd64 \
            -bin darwin/amd64=dist/pzlauncher-darwin-amd64 \
            -bin darwin/arm64=dist/pzlauncher-darwin-arm64 \
            -out dist/manifest.json
          cat dist/manifest.json

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pzlauncher-windows-amd64.exe
            dist/pzlauncher-linux-amd64
            dist/pzlauncher-darwin-amd64
            dist/pzlauncher-darwin-arm64
            dist/manifest.json
            dist/projectzomboid.jar
          fail_on_unmatched_files: false
