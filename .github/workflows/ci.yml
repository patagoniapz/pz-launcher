name: ci

# Comprobaciones de construcción en cada pull request y en los push a main.
# NO publica nada (eso lo hace release.yml al empujar una etiqueta vX.Y.Z);
# aquí solo verificamos que todo compila, pasa el vet y los tests, incluida la
# GUI de Wails compilada en un runner de Windows (que no se puede cruzar).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Compilar binarios de consola (cross-compile)
        run: |
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/launcher
          done

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Instalar Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Compilar la GUI de Wails (sin publicar)
        shell: bash
        working-directory: gui
        run: wails build -s -trimpath -o pzlauncher-gui-ci.exe
